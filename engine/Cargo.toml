[package]
name = "clone-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
clone-render = { path = "../render", features = ["uniffi"] }
clone-text = { path = "../text" }
wgpu = "29"
winit = "0.30"
uniffi = { version = "0.31", features = ["cli"] }
pollster = "0.4"
bytemuck = { version = "1.4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
thiserror = "2"
cosmic-text = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rustc-hash = "2"
resvg = "0.47"
include_dir = "0.7"

wgpu-shared-surface = { path = "../wgpu-shared-surface" }

# Direct DRM/KMS server backend (Linux): own the display without a wayland host.
[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.14"
gbm = "0.18"
input = "0.9"
libc = "0.2"

[dev-dependencies]
pollster = "0.4"

[[bin]]
name = "drm-smoke"
path = "src/bin/drm_smoke.rs"

[[bin]]
name = "drm-gpu-smoke"
path = "src/bin/drm_gpu_smoke.rs"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "clone-desktop"
path = "src/bin/desktop.rs"
