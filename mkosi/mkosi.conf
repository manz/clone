# Clone appliance - Debian 12 (bookworm) aarch64, built with mkosi.
# FHS alternative to the NixOS appliance: Swift/cargo/zig build natively, no
# nix-ld / swiftly --platform / FHS-shell gymnastics. Spike target: boot ->
# _windowserver -> LoginWindow -> desktop.
#
# Build (on an aarch64 Linux host, e.g. clone-dev):
#   make os-stage                       # stage .build/clone-root (the binaries)
#   sudo mkosi --force build             # -> mkosi/build/clone-debian.raw
#   qemu-img convert -O qcow2 ... .qcow2 # for UTM (see scripts/mkosi-image.sh)

[Distribution]
Distribution=debian
Release=trixie
Architecture=arm64
# Debian's Swift toolchain repo isn't needed at RUNTIME (binaries are prebuilt);
# the Swift *runtime* libs are copied into /System/Library/swift-linux in postinst.

[Output]
Format=disk
ImageId=clone-debian
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
# The built Clone tree (binaries + bundled Swift runtime + wallpapers) copied to /.
# Produced by `make os-stage` (.build/clone-root); gitignored, so not in mkosi.extra.
ExtraTrees=../.build/clone-root:/
KernelCommandLine=console=tty0 console=ttyAMA0,115200 systemd.log_level=info
# Stateless-ish: users/files/dirs come from sysusers.d + tmpfiles.d + mkosi.extra.
RootPassword=clone
Hostname=clone
Locale=C.UTF-8
Packages=
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-sysv
        systemd-resolved
        udev
        dbus
        linux-image-arm64
        openssh-server
        sudo
        zsh
        ca-certificates
        less
        vim
        # --- GPU / DRM / input (Clone's run_drm backend) ---
        libgl1
        libegl1
        libgles2
        libglvnd0
        libgbm1
        libdrm2
        libgl1-mesa-dri
        mesa-vulkan-drivers
        libvulkan1
        libxkbcommon0
        libwayland-egl1
        libwayland-client0
        libinput10
        libudev1
        # --- Foundation / app runtime deps ---
        libsqlite3-0
        libcurl4
        libxml2
        zlib1g
        libstdc++6
        libpam0g
        libpam-modules
        libpam-systemd
        dbus-user-session
        qemu-guest-agent
        libasound2
        libncurses6
        libtinfo6
        # --- fonts ---
        fontconfig
        fonts-liberation
        fonts-noto-core
        # --- dev box: package manager (apt at runtime) + build toolchain + disk
        # grow tools. Swift (swiftly), Rust (rustup), Zig, claude + the -dev libs
        # are installed live via apt/curl, not baked (keeps the image lean).
        apt
        apt-utils
        build-essential
        pkg-config
        clang
        git
        curl
        wget
        ca-certificates
        gnupg
        xz-utils
        unzip
        rsync
        python3
        e2fsprogs
        cloud-guest-utils
        gdisk
        fdisk
