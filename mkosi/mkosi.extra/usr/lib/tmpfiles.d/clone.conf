# Clone runtime dirs + macOS home layout (ports the appliance tmpfiles).
# /System,/Applications,/Library are REAL dirs on Debian (copied from clone-root
# in postinst) - no nix-store symlinks needed.

# Cross-user compositor socket dir (setgid clone, group-writable).
d /run/clone 2775 _windowserver clone -

# macOS home layout for manz.
d /Users 0755 root root -
d /Users/manz 0755 manz users -
d /Users/manz/Desktop 0755 manz users -
d /Users/manz/Documents 0755 manz users -
d /Users/manz/Downloads 0755 manz users -
d /Users/manz/Library 0755 manz users -
d /Users/manz/Movies 0755 manz users -
d /Users/manz/Music 0755 manz users -
d /Users/manz/Pictures 0755 manz users -
d /Users/manz/Public 0755 manz users -
f /Users/manz/.zshrc 0644 manz users -
