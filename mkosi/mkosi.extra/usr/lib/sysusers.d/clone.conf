# Clone users + groups (declarative, like the appliance's users.* config).
# Passwords (dev/manz = "clone") are set in mkosi.postinst via chpasswd.
g clone -
u _windowserver - "Clone WindowServer" /var/lib/clone-windowserver /usr/sbin/nologin
u dev - "Clone Dev" /home/dev /bin/bash
u manz - "Manz" /Users/manz /usr/bin/zsh

# _windowserver: device + socket access (no nix-ld; FHS loader is native)
m _windowserver video
m _windowserver render
m _windowserver input
m _windowserver tty
m _windowserver clone
# dev: ssh + sudo + gpu + socket
m dev sudo
m dev render
m dev clone
# manz: desktop user
m manz sudo
m manz audio
m manz render
m manz clone
